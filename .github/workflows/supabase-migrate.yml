name: SUPABASE SCHEMA

on:
  pull_request:
    branches: [ trunk ]
  push:
    branches: [ trunk ]

jobs:
  check:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        ports: [ "5432:5432" ]
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-retries 10

    env:
      PGUSER: postgres

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: cachix/install-nix-action@v31

      - name: Merged migrations are immutable
        run: |
          changed=$(git diff --name-status "origin/${{ github.base_ref }}...HEAD" -- supabase/migrations | grep -v '^A' || true)
          if [ -n "$changed" ]; then
            echo "$changed"
            echo "::error::existing migrations were modified; add a new one instead"
            exit 1
          fi

      - name: Lint sql/
        run: nix run .#db -- schema lint

      - name: Migrations produce sql/
        run: nix run .#db -- schema check

  deploy:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    environment: supabase-production

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        ports: [ "5432:5432" ]
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-retries 10

    env:
      PGUSER: postgres
      DB_URL: ${{ secrets.SUPABASE_DB_URL }}
      DB_YES: "1"

    steps:
      - uses: actions/checkout@v4

      - uses: cachix/install-nix-action@v31

      - name: No changes outside migrations
        run: nix run .#db -- schema drift

      - name: Apply pending migrations
        run: nix run .#db -- migration up
